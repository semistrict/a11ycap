# A11yCap Tools and Servers Reference
# Centralized configuration for all tools and servers in the a11ycap project

project:
  name: a11ycap
  description: Accessibility snapshot library with MCP server for web agent integration
  repository: https://github.com/semistrict/a11ycap
  license: MIT
  version: "1.0.0"

# ============================================================================
# Servers
# ============================================================================

servers:
  mcp:
    name: a11ycap-mcp
    description: MCP (Model Context Protocol) server for web agent integration with accessibility tools
    type: stdio
    port: 12456  # WebSocket port for browser connections
    transport: stdio  # Primary MCP protocol transport
    websocket: true   # Supports WebSocket connections from browsers
    features:
      - WebSocket server for browser connections
      - Stdio-based MCP protocol communication
      - Primary/secondary server architecture for multiple MCP instances
      - Browser injection via console or HTML script tag
      - SessionId-based browser connection routing
    connection_methods:
      console_injection: |
        Paste in browser console:
        (See CONSOLE_INJECTION_SCRIPT in constants.ts)
      html_injection: |
        Add to HTML:
        <script src="http://localhost:12456/a11ycap.js"></script>

  browser_connection_manager:
    name: Browser Connection Manager
    description: Manages WebSocket connections between browsers and MCP server
    implementations:
      primary: PrimaryBrowserConnectionManager
      secondary: RemoteBrowserConnectionManager
    features:
      - Direct WebSocket management for primary server
      - HTTP client for secondary instances
      - SessionId-based connection routing
      - Command timeout handling
      - Connection health monitoring

# ============================================================================
# Common Schema Components
# ============================================================================

schemas:
  baseToolSchema:
    description: Used by legacy single-element tools
    properties:
      element:
        type: string
        required: true
        description: Human-readable element description for permission
      ref:
        type: string
        required: true
        description: Element reference from snapshot (e.g., "e5")
      captureSnapshot:
        type: boolean
        required: false
        default: true
        description: Capture accessibility snapshot after action

  multiElementToolSchema:
    description: Used by multi-element targeting tools
    properties:
      element:
        type: string
        required: false
        description: Human-readable element description for permission
      refs:
        type: array
        items: string
        required: false
        description: Element references from snapshot (e.g., ["e5", "e7"])
      selector:
        type: string
        required: false
        description: CSS selector to target multiple elements
      boundingBox:
        type: object
        required: false
        description: Bounding box to capture elements (x, y, width, height)
        properties:
          x: { type: number }
          y: { type: number }
          width: { type: number }
          height: { type: number }
      captureSnapshot:
        type: boolean
        required: false
        default: true
        description: Capture accessibility snapshot after action

# ============================================================================
# MCP Tools
# ============================================================================

tools:
  # --- Snapshot and Navigation ---

  take_snapshot:
    category: snapshot
    priority: recommended
    description: |
      Take an accessibility snapshot from a connected browser. This is the RECOMMENDED way
      to get an overview of the interactivity of a page.

      Returns a text representation showing:
      - Interactive elements with clickable references [ref=e1, e2, etc.]
      - Element roles, labels, and ARIA attributes
      - Hierarchical structure with proper indentation
      - React component information (when available)

      IMPORTANT: If snapshot is truncated due to size limits, DO NOT assume missing
      elements don't exist - they may have been omitted. Use follow-up calls with
      'selector' or 'refs' parameters to get specific elements.
    parameters:
      mode:
        type: enum
        values: [ai, expect, codegen, autoexpect]
        default: ai
        required: false
        description: Snapshot mode
      enableReact:
        type: boolean
        default: true
        required: false
        description: Enable React component information
      refs:
        type: array
        items: string
        required: false
        description: Element references from snapshot (e.g., ["e5", "e7"]) for specific elements
      selector:
        type: string
        required: false
        description: CSS selector to capture multiple elements (e.g., ".button", "div[data-test]")
      boundingBox:
        type: object
        required: false
        description: Bounding box to capture all elements within (coordinates relative to viewport)
        properties:
          x: { type: number }
          y: { type: number }
          width: { type: number }
          height: { type: number }
      max_chars:
        type: number
        default: 4096
        required: false
        description: Maximum size in characters for the snapshot (uses breadth-first expansion)
    example_output: |
      button "Submit Form" [ref=e1]
        text "Submit"
      form [ref=e2]
        textbox "Email" [ref=e3]
        textbox "Password" [ref=e4]
      link "Forgot Password?" [ref=e5]

  list_tabs:
    category: session
    priority: required_first
    description: |
      List all connected browser tabs with their URLs and titles. This should be the FIRST
      tool used to see which browser tabs are available for automation.

      Returns information about each connected browser session including:
      - sessionId: Unique identifier for each tab connection
      - URL: Current page URL
      - Title: Page title
      - Last seen timestamp

      IMPORTANT: Session IDs change when users navigate to different pages. If you get
      "session not found" errors, re-run list_tabs to get updated session IDs.

      If no tabs are connected, this tool provides instructions for connecting browsers
      via console injection or HTML script tags.
    parameters: {}

  # --- Element Interaction ---

  click_element:
    category: interaction
    description: Click an element using its accessibility snapshot reference
    extends: baseToolSchema
    parameters: {}  # Inherits from baseToolSchema

  type_text:
    category: interaction
    description: Type text into an editable element
    extends: baseToolSchema
    parameters:
      text:
        type: string
        required: true
        description: Text to type into the element
      slowly:
        type: boolean
        default: false
        required: false
        description: |
          Whether to type one character at a time. Useful for triggering key handlers
          in the page. By default entire text is filled in at once.
      submit:
        type: boolean
        default: false
        required: false
        description: Whether to submit entered text (press Enter after)

  hover_element:
    category: interaction
    description: Hover over an element
    extends: baseToolSchema
    parameters: {}

  select_option:
    category: interaction
    description: Select an option in a dropdown
    extends: baseToolSchema
    parameters:
      values:
        type: array
        items: string
        required: true
        description: Array of values to select in the dropdown. Can be single or multiple values.

  press_key:
    category: interaction
    description: Press a key on the keyboard
    parameters:
      key:
        type: string
        required: true
        description: Name of the key to press or character to generate (e.g., 'ArrowLeft', 'a')
      captureSnapshot:
        type: boolean
        default: true
        required: false
        description: Capture accessibility snapshot after action

  press_key_global:
    category: interaction
    description: Press a key globally on the document (not targeting a specific element)
    parameters:
      key:
        type: string
        required: true
        description: Name of the key to press or character to generate (e.g., 'ArrowLeft', 'a')
      captureSnapshot:
        type: boolean
        default: true
        required: false
        description: Capture accessibility snapshot after action

  wait_for:
    category: interaction
    description: Wait for text to appear/disappear or CSS selectors to match/not match on the page
    parameters:
      text:
        type: string
        required: false
        description: The text to wait for
      textGone:
        type: string
        required: false
        description: The text to wait for to disappear
      selector:
        type: string
        required: false
        description: CSS selector to wait for (element to appear)
      selectorGone:
        type: string
        required: false
        description: CSS selector to wait for to disappear
      captureSnapshot:
        type: boolean
        default: true
        required: false
        description: Capture accessibility snapshot after action

  # --- Element Inspection ---

  get_element_info:
    category: inspection
    description: |
      Get comprehensive information about one or more elements without including sub-elements.
      Returns detailed data for debugging, accessibility analysis, and automated testing.

      For each element, returns extensive information including:

      **Basic Properties:**
      - ref: Element reference for other tools
      - tagName, id, className: Basic HTML identifiers
      - textContent, innerText, value: Content information

      **Accessibility (ARIA):**
      - All ARIA attributes (role, label, expanded, checked, etc.)
      - Computed accessibility name and role
      - Keyboard navigation status
      - Heading levels and landmarks

      **Visual Styling:**
      - Computed CSS properties (display, position, colors, fonts, etc.)
      - Geometry (x, y, width, height, bounding box)
      - Visibility status and viewport intersection
      - Z-index and stacking context information

      **Element State:**
      - Interactive states (focused, disabled, checked, selected)
      - Form validation status and properties
      - Event listeners attached to element

      **Contextual Information:**
      - Parent element details
      - Children summary
      - Sibling position and adjacent elements

      **Specialized Data:**
      - Image info: dimensions, scaling, loading status, alt text
      - Form info: validation, autocomplete, input constraints
      - React info: component name, props, hooks, source location (when available)
      - Performance: animations, transitions, render timing
    extends: multiElementToolSchema
    parameters:
      ref:
        type: string
        required: false
        description: Element reference from snapshot (e.g., "e5") - legacy, use refs instead

  show_element_picker:
    category: inspection
    description: |
      Show an interactive element picker overlay to visually select elements on the page.
      Multiple elements can be selected by clicking.
    parameters:
      includeSnapshots:
        type: boolean
        required: false
        description: Include accessibility snapshots of selected elements

  get_picked_elements:
    category: inspection
    description: |
      Retrieve elements that were picked using the visual element picker. Returns full
      element information for previously selected elements.

      IMPORTANT: Elements must be picked first using the Element Picker. The user can
      pick elements by:
      1. Press **ESC three times** to open the A11yCap Tools menu
      2. Click "🎯 Element Picker"
      3. The picker overlay will activate - user can click on any elements on the page
      4. Multiple elements can be selected by clicking different parts of the page
      5. Press ESC to exit the picker when done

      This tool returns the same detailed ElementInfo data as get_element_info, but only
      for elements that were previously picked by the user through the visual interface.
    parameters:
      limit:
        type: number
        default: 50
        required: false
        description: Maximum number of picked elements to return
      since:
        type: number
        required: false
        description: Get picked elements since this timestamp (milliseconds since epoch)

  # --- Element Modification ---

  mutate_element:
    category: modification
    description: Modify attributes, properties, styles, or content of one or more elements
    extends: multiElementToolSchema
    parameters:
      ref:
        type: string
        required: false
        description: Element reference from snapshot (e.g., "e5") - legacy, use refs instead
      attributes:
        type: object
        required: false
        description: Attributes to set or remove. Use null to remove an attribute
      properties:
        type: object
        required: false
        description: DOM properties to set (e.g., value, checked, selected)
      styles:
        type: object
        required: false
        description: CSS styles to set or remove. Use null to remove a style
      textContent:
        type: string
        required: false
        description: Set the text content of the element
      innerHTML:
        type: string
        required: false
        description: Set the innerHTML of the element (use with caution)
      add_classes:
        type: array
        items: string
        required: false
        description: CSS classes to add to the element
      remove_classes:
        type: array
        items: string
        required: false
        description: CSS classes to remove from the element

  # --- Accessibility Analysis ---

  doctor:
    category: accessibility
    priority: recommended
    description: |
      Perform comprehensive accessibility analysis using axe-core. For best results, run
      without element targeting to analyze the entire document. Element-specific analysis
      available for debugging individual components.

      Returns detailed accessibility analysis including:

      **Analysis Summary:**
      - Total violations count by severity (critical, serious, moderate, minor)
      - Incomplete checks that require manual verification
      - Passing rules and inapplicable rules
      - Analysis scope (page vs elements) and execution time

      **Violation Details:**
      - Rule ID, description, and help text for each violation
      - Impact level (critical, serious, moderate, minor)
      - WCAG guideline references and compliance level
      - Target selectors and affected DOM nodes
      - Suggested fixes and remediation guidance

      **Best Practices Analysis:**
      - Categorized recommendations by accessibility domain (forms, images, keyboard, etc.)
      - WCAG 2.1 Level A/AA/AAA compliance analysis
      - User group impact analysis (screen readers, keyboard users, low vision)
      - Prioritized action items and next steps

      **Configuration Options:**
      - Preset configurations for WCAG-AA, WCAG-AAA, Section 508, or best practices
      - Severity filtering to focus on critical issues first
      - Rule exclusion for custom testing scenarios
      - Element information inclusion for detailed debugging

      **When to Use:**
      - Initial accessibility audit of entire pages or applications
      - Validating fixes after addressing accessibility issues
      - Component testing during development workflow
      - Compliance verification against WCAG or Section 508 standards
      - Pre-release accessibility quality assurance

      **Output Analysis:**
      The tool provides actionable insights organized by priority and user impact, making
      it easy to identify which issues to fix first for maximum accessibility improvement.
      Critical and serious violations should always be addressed first as they significantly
      impact users with disabilities.
    extends: multiElementToolSchema
    parameters:
      ref:
        type: string
        required: false
        description: |
          Element reference from snapshot (e.g., "e5") - legacy, use refs instead.
          Note: omit all element targeting for comprehensive page analysis.
      includeElementInfo:
        type: boolean
        default: false
        required: false
        description: Include detailed element information for violations
      maxViolations:
        type: number
        default: 50
        required: false
        description: Maximum number of violations to return
      tags:
        type: array
        items: string
        required: false
        description: Axe tags to filter rules (e.g., ["wcag2a", "wcag21aa", "best-practice"])
      excludeRules:
        type: array
        items: string
        required: false
        description: Rule IDs to exclude from analysis
      severity:
        type: array
        items:
          enum: [minor, moderate, serious, critical]
        required: false
        description: Filter violations by severity level
      locale:
        type: string
        required: false
        description: Locale for internationalized results (e.g., "en", "fr", "es")
      preset:
        type: enum
        values: [wcag-aa, wcag-aaa, section508, best-practice]
        required: false
        description: Use predefined configuration preset for common accessibility standards

  # --- Monitoring and Debugging ---

  get_network_requests:
    category: monitoring
    description: |
      Retrieve recent network requests using the Web Performance API. Returns detailed
      information about HTTP requests made by the page including timing, size, and type data.

      Each entry shows:
      - HTTP method/type (FETCH, SCRIPT, STYLESHEET, IMAGE, etc.)
      - Full URL of the request
      - Duration in milliseconds (if available)
      - Transfer size in KB (if available)

      Useful for debugging API calls, monitoring performance, analyzing resource loading,
      and understanding network traffic patterns.
    parameters:
      limit:
        type: number
        default: 50
        required: false
        description: Maximum number of requests to return
      includeDataUrls:
        type: boolean
        default: false
        required: false
        description: Whether to include data: URLs in the results
      resourceType:
        type: enum
        values: [all, fetch, xmlhttprequest, navigate, script, stylesheet, image, font, other]
        default: all
        required: false
        description: Filter by resource type
    example_output: |
      Network requests (8 entries):

      FETCH https://api.example.com/users (245ms) [2KB]
      SCRIPT https://cdn.example.com/js/analytics.js (156ms) [45KB]
      STYLESHEET https://fonts.googleapis.com/css2?family=Inter (89ms) [12KB]
      IMAGE https://images.example.com/logo.png (67ms) [8KB]

  get_console_logs:
    category: monitoring
    description: Retrieve console logs from a connected browser
    parameters:
      level:
        type: enum
        values: [log, warn, error, info, debug]
        required: false
        description: Filter by log level
      since:
        type: number
        required: false
        description: Get logs since this timestamp (milliseconds since epoch)
      limit:
        type: number
        default: 100
        required: false
        description: Maximum number of logs to return

  get_user_interactions:
    category: monitoring
    description: |
      Retrieve recorded user interaction events from the buffer. Shows chronological
      history of user actions on the page.

      IMPORTANT: User interactions must be recorded first. The user can start recording by:
      1. Press **ESC three times** to open the A11yCap Tools menu
      2. Click "🔴 Interaction Recorder"
      3. The recorder will automatically start capturing interactions
      4. User can then perform actions (click, type, navigate) which will be recorded

      Interaction types captured:
      - **click**: Element clicks with coordinates and modifier keys
      - **input/change**: Text input with target element and values
      - **keydown**: Keyboard events with keys and modifiers
      - **focus/blur**: Element focus changes
      - **navigation**: Page navigation (back/forward, pushstate, etc.)

      Each event includes timestamp, target element (with refs when available), and
      relevant interaction data. Perfect for understanding user behavior patterns,
      debugging UI interactions, and analyzing user workflows.
    parameters:
      type:
        type: string
        required: false
        description: Filter by interaction type (click, input, change, keydown, navigation, focus, blur)
      since:
        type: number
        required: false
        description: Get interactions since this timestamp (milliseconds since epoch)
      limit:
        type: number
        default: 100
        required: false
        description: Maximum number of interactions to return
    example_output: |
      User Interactions (5 events):
      [2023-08-23T15:30:45.123Z] Click on BUTTON[e2] at (150, 200)
      [2023-08-23T15:30:46.456Z] Type in INPUT#email (email): "user@example.com"
      [2023-08-23T15:30:47.789Z] Key press Tab on INPUT#email

  # --- Content Extraction ---

  get_readability:
    category: content
    description: Extract readable article content from the current page using Mozilla Readability
    parameters:
      includeContent:
        type: boolean
        default: true
        required: false
        description: Include the main article content (can be very long)
      includeExcerpt:
        type: boolean
        default: true
        required: false
        description: Include a brief excerpt of the article
      maxContentLength:
        type: number
        default: 50000
        required: false
        description: Maximum length of content to return (characters)

  capture_element_image:
    category: content
    description: |
      Capture a PNG image of an element using its accessibility snapshot reference.
      Uses html-to-image library and may not be pixel-perfect compared to browser screenshots.
    extends: baseToolSchema
    parameters:
      quality:
        type: number
        default: 0.92
        min: 0
        max: 1
        required: false
        description: Image quality for JPEG format
      backgroundColor:
        type: string
        required: false
        description: Background color for the image (CSS color)
      width:
        type: number
        required: false
        description: Width of the captured image
      height:
        type: number
        required: false
        description: Height of the captured image
      cacheBust:
        type: boolean
        default: false
        required: false
        description: Add cache busting to avoid CORS issues

  # --- Code Execution ---

  execute_js:
    category: execution
    description: |
      Execute JavaScript code in a connected browser. Code MUST be wrapped in an IIFE.
    parameters:
      description:
        type: string
        required: true
        description: Human-readable description of what this code does
      code:
        type: string
        required: true
        description: |
          JavaScript code to execute. MUST be an IIFE (Immediately Invoked Function Expression)
          like: `(() => { /* code */ })()` or `(async () => { /* code */ })()`
      returnValue:
        type: boolean
        default: true
        required: false
        description: Whether to return the execution result

# ============================================================================
# Tool Categories
# ============================================================================

categories:
  snapshot:
    description: Tools for capturing accessibility snapshots of page elements
    tools: [take_snapshot]

  session:
    description: Tools for managing browser connections and sessions
    tools: [list_tabs]

  interaction:
    description: Tools for interacting with page elements
    tools: [click_element, type_text, hover_element, select_option, press_key, press_key_global, wait_for]

  inspection:
    description: Tools for inspecting and analyzing page elements
    tools: [get_element_info, show_element_picker, get_picked_elements]

  modification:
    description: Tools for modifying page elements
    tools: [mutate_element]

  accessibility:
    description: Tools for accessibility analysis and compliance
    tools: [doctor]

  monitoring:
    description: Tools for monitoring page activity and debugging
    tools: [get_network_requests, get_console_logs, get_user_interactions]

  content:
    description: Tools for extracting and capturing page content
    tools: [get_readability, capture_element_image]

  execution:
    description: Tools for executing custom code in the browser
    tools: [execute_js]

# ============================================================================
# Recommended Workflows
# ============================================================================

workflows:
  getting_started:
    name: Getting Started with Browser Automation
    steps:
      - tool: list_tabs
        description: First, list all connected browser tabs to get session IDs
      - tool: take_snapshot
        description: Take a snapshot to see available interactive elements
      - tool: click_element
        description: Use element refs from snapshot to interact with the page

  accessibility_audit:
    name: Complete Accessibility Audit
    steps:
      - tool: list_tabs
        description: Connect to the target browser tab
      - tool: doctor
        description: Run accessibility analysis without element targeting for comprehensive audit
      - tool: get_element_info
        description: Get detailed info for specific violating elements
      - tool: mutate_element
        description: Fix accessibility issues (if possible via DOM modification)
      - tool: doctor
        description: Re-run analysis to verify fixes

  user_interaction_analysis:
    name: Analyze User Interaction Patterns
    steps:
      - tool: list_tabs
        description: Connect to browser tab
      - note: User activates interaction recorder (ESC x3, click "🔴 Interaction Recorder")
      - note: User performs actions on the page
      - tool: get_user_interactions
        description: Retrieve recorded interactions
      - tool: take_snapshot
        description: Capture current page state
      - tool: get_element_info
        description: Get details about interacted elements

  visual_element_picking:
    name: Visual Element Selection and Inspection
    steps:
      - tool: list_tabs
        description: Connect to browser tab
      - tool: show_element_picker
        description: Activate visual element picker
      - note: User clicks on elements to select them
      - tool: get_picked_elements
        description: Retrieve information about picked elements
      - tool: take_snapshot
        description: Capture snapshot of picked elements

# ============================================================================
# Packages
# ============================================================================

packages:
  a11ycap:
    name: a11ycap
    description: Core accessibility snapshot library (browser-compatible)
    main_exports:
      - snapshotForAI()
      - snapshot()
      - clickRef()
      - findElementByRef()
      - getElementPicker()
    key_modules:
      - ariaSnapshot.ts - Core ARIA tree generation and rendering
      - reactUtils.ts - React component information extraction
      - elementPicker.ts - Visual element picker implementation
      - tools/ - MCP tool implementations
      - mcpConnection.ts - WebSocket client for browser-to-MCP communication
      - isomorphic/ - Shared utilities between browser and server

  a11ycap-mcp:
    name: a11ycap-mcp
    description: MCP server for web agent integration
    features:
      - Stdio-based MCP server
      - WebSocket support for browser connections
      - Primary/secondary server architecture
      - Browser injection script
      - SessionId-based connection routing
    key_modules:
      - index.ts - Main server entry with stdio transport
      - mcp-server.ts - MCP tool implementations
      - browser-connection-manager.ts - WebSocket management and browser connection handling

  babel-plugin-a11ycap:
    name: babel-plugin-a11ycap
    description: Babel plugin for enhanced debug information
    features:
      - Adds debug source info to JSX elements as data attributes

  testpagecra:
    name: testpagecra
    description: Create React App test page for testing
    port: 14652
    purpose: Fixture repository for all test scenarios
